# Dispara a sequência de carrinho abandonado a cada hora.
# O cron da Vercel no plano gratuito (Hobby) roda só 1x por dia, por isso usamos o GitHub Actions.
# Configure em GitHub > Settings > Secrets and variables > Actions:
#   SITE_URL     = https://seudominio.com
#   CRON_SECRET  = o mesmo valor da variável CRON_SECRET da Vercel
name: cron-abandonados

on:
  schedule:
    - cron: "7 * * * *" # minuto 7 de cada hora (UTC); horários redondos costumam atrasar
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de abandonados
        run: |
          # Mostra o status e, se houver redirecionamento, para onde (ajuda a achar um SITE_URL errado).
          info=$(curl -s -o resposta.json -w "%{http_code} %{redirect_url}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/abandonados")
          echo "Status e redirecionamento: $info"
          cat resposta.json
          echo
          status=${info%% *}
          test "$status" = "200"
